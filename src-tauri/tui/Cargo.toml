[package]
name = "yesplaymusic-tui"
version = "0.9.2"
description = "ypm — YesPlayMusic in the terminal"
edition = "2021"
rust-version = "1.91"
license = "GPL-3.0-only"
publish = false

[[bin]]
name = "ypm"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.104"
base64 = "=0.22.1"
minisign-verify = "=0.2.4"
clap = { version = "=4.6.6", features = ["derive"] }
crossterm = { version = "=0.29.0", features = ["event-stream"] }
dirs = "=6.0.0"
futures-util = "=0.3.33"
image = { version = "=0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
ncm-api-rs = "=0.1.0"
qrcode = { version = "=0.14.1", default-features = false }
ratatui = "=0.30.2"
ratatui-image = { version = "=11.0.6", default-features = false, features = ["crossterm", "tokio"] }
reqwest = { version = "=0.12.23", default-features = false, features = ["rustls-tls"] }
rodio = { version = "=0.22.2", features = ["symphonia-all"] }
rustfft = "=6.4.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
# default-features off: the defaults drag reqwest's native-tls in beside
# rustls. reqwest13 below exists for feature unification only: it steers
# stream-download's reqwest 0.13 onto the ring-backed rustls the 0.12 stack
# already links, instead of adding a second crypto backend (aws-lc-sys).
stream-download = { version = "=0.24.3", default-features = false, features = ["reqwest", "temp-storage"] }
reqwest13 = { package = "reqwest", version = "=0.13.4", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "=0.23.31", default-features = false, features = ["ring"] }
tempfile = "=3.27.0"
thiserror = "=2.0.19"
tokio = { version = "=1.53.1", features = ["full"] }
toml = "=1.1.4"
tracing = "=0.1.44"
tracing-appender = "=0.2.3"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter"] }
unicode-width = "=0.2.2"
yesplaymusic-core = { path = "../core", features = ["cache"] }
