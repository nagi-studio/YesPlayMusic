[package]
name = "yesplaymusic-tauri"
version = "0.8.0-canary.1"
description = "YesPlayMusic 的跨平台 Tauri 客户端"
authors = ["YesPlayMusic contributors"]
edition = "2021"
rust-version = "1.88"
license = "MIT"

[workspace]
members = ["sidecar"]
resolver = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cookie = "0.18.1"
discord-rich-presence = "1.1.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
getrandom = "0.2"
leveldb-core = "0.1.2"
reqwest = { version = "0.11.27", default-features = false, features = ["rustls-tls"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
tauri = { version = "2", features = ["tray-icon", "macos-proxy"] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri-plugin-updater = "=2.10.1"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tempfile = "3.27"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "=0.2.189"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSObject", "NSSet", "NSString"] }
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSButton", "NSButtonTouchBarItem", "NSControl", "NSImage", "NSMenu", "NSMenuItem", "NSResponder", "NSTouchBar", "NSTouchBarItem", "NSView", "NSWindow"] }

[target.'cfg(target_os = "linux")'.dependencies]
futures-lite = "2.6"
mpris-server = "0.10.0"
zbus = "5.19.0"

[patch.crates-io]
tauri-plugin-updater = { path = "patches/tauri-plugin-updater-2.10.1" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
