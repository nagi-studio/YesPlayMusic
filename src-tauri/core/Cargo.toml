[package]
name = "yesplaymusic-core"
version = "0.9.2"
description = "YesPlayMusic shared business logic (UNM, session, cache)"
edition = "2021"
rust-version = "1.89"
license = "GPL-3.0-only"
publish = false

[features]
default = []
# SQLite-backed track cache stays opt-in so the Sidecar release graph does not
# link cache-only dependencies.
cache = ["dep:md-5", "dep:rusqlite", "dep:sha2", "dep:tempfile"]

[dependencies]
anyhow = "=1.0.104"
async-trait = "=0.1.92"
base64 = "=0.22.1"
futures-util = "=0.3.33"
md-5 = { version = "=0.10.6", optional = true }
ncm-api-rs = "=0.1.0"
reqwest = { version = "=0.12.23", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"], optional = true }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.10.9", optional = true }
tempfile = { version = "=3.27.0", optional = true }
thiserror = "=2.0.19"
tokio = { version = "=1.53.1", features = ["sync", "time", "rt"] }
unm_api_utils = "=0.4.0"
unm_engine = "=0.4.0"
unm_types = "=0.4.0"

[dev-dependencies]
tempfile = "=3.27.0"
tokio = { version = "=1.53.1", features = ["full"] }
