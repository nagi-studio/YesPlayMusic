name: Publish canary updater feed

on:
  release:
    types: [published]

concurrency:
  group: yesplaymusic-canary-updater-feed
  cancel-in-progress: false

jobs:
  publish-canary-feed:
    if: >-
      github.event.release.prerelease &&
      startsWith(github.event.release.tag_name, 'v') &&
      contains(github.event.release.tag_name, '-canary.')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install updater artifact inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full squashfs-tools

      - name: Download published updater artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          YPM_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/yesplaymusic-canary-release"
          gh release download "$YPM_RELEASE_TAG" --dir "$RUNNER_TEMP/yesplaymusic-canary-release"

      - name: Rebuild and verify canary manifest
        env:
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          YPM_RELEASE_TAG: ${{ github.event.release.tag_name }}
          YPM_RELEASE_PUBLISHED_AT: ${{ github.event.release.published_at }}
        run: |
          YPM_RELEASE_VERSION="${YPM_RELEASE_TAG#v}"
          bun scripts/generate-updater-manifest.mjs \
            "$RUNNER_TEMP/yesplaymusic-canary-release" \
            "$RUNNER_TEMP/canary.json" \
            "$YPM_RELEASE_VERSION" \
            "$YPM_RELEASE_TAG" \
            "$YPM_RELEASE_PUBLISHED_AT"

      - name: Publish immutable-version manifest to canary channel
        env:
          GH_TOKEN: ${{ github.token }}
          YPM_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          YPM_FEED_BRANCH="updater-feed"
          YPM_FEED_PATH="channels/canary.json"
          YPM_FEED_API="repos/$GITHUB_REPOSITORY/contents/$YPM_FEED_PATH"

          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$YPM_FEED_BRANCH" >/dev/null 2>&1; then
            YPM_DEFAULT_BRANCH="$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)"
            YPM_DEFAULT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$YPM_DEFAULT_BRANCH" --jq .object.sha)"
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/heads/$YPM_FEED_BRANCH" \
              -f "sha=$YPM_DEFAULT_SHA"
          fi

          YPM_FEED_SHA="$(gh api "$YPM_FEED_API?ref=$YPM_FEED_BRANCH" --jq .sha 2>/dev/null || true)"
          if [[ -n "$YPM_FEED_SHA" ]]; then
            gh api "$YPM_FEED_API?ref=$YPM_FEED_BRANCH" --jq .content \
              | tr -d '\n' \
              | base64 --decode \
              > "$RUNNER_TEMP/current-canary.json"
            bun scripts/verify-updater-feed-advance.mjs \
              "$RUNNER_TEMP/current-canary.json" \
              "$RUNNER_TEMP/canary.json"
          fi

          YPM_FEED_CONTENT="$(base64 < "$RUNNER_TEMP/canary.json" | tr -d '\n')"
          YPM_API_ARGS=(
            --method PUT
            "$YPM_FEED_API"
            -f "message=发布 $YPM_RELEASE_TAG 的 canary 更新清单"
            -f "content=$YPM_FEED_CONTENT"
            -f "branch=$YPM_FEED_BRANCH"
          )
          if [[ -n "$YPM_FEED_SHA" ]]; then
            YPM_API_ARGS+=(-f "sha=$YPM_FEED_SHA")
          fi
          gh api "${YPM_API_ARGS[@]}"
