name: Desktop builds

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Scopes the expensive work to what actually changed. Anything it cannot
  # resolve (tags, dispatch, unknown base) falls back to running everything.
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
      rust: ${{ steps.classify.outputs.rust }}
      tui-only: ${{ steps.classify.outputs.tui-only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - id: classify
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          FORCE_FULL: ${{ (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.forced == true)) && 'true' || 'false' }}
        run: bun scripts/classify-ci-changes.mjs >> "$GITHUB_OUTPUT"

  # Docs still reach the test suite (README assertions, locale parity), so a
  # docs-only change skips packaging but never skips the cheap gates.
  docs-gates:
    name: Docs gates
    needs: changes
    if: needs.changes.outputs.docs-only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Prepare environment
        run: cp .env.example .env

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Test
        run: bun test

      - name: Typecheck
        run: bun run typecheck

  build-tauri-arm64:
    name: Tauri Apple Silicon
    needs: changes
    if: needs.changes.outputs.docs-only != 'true' && needs.changes.outputs.tui-only != 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy,rustfmt
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Prepare environment
        run: cp .env.example .env

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Test
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: Test Rust Sidecar
        if: needs.changes.outputs.rust == 'true'
        run: cargo test --locked --manifest-path src-tauri/sidecar/Cargo.toml

      - name: Clippy Rust Sidecar
        if: needs.changes.outputs.rust == 'true'
        run: cargo clippy --locked --manifest-path src-tauri/sidecar/Cargo.toml --all-targets -- -D warnings

      - name: Check Rust formatting
        if: needs.changes.outputs.rust == 'true'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Prepare Tauri resources for Rust tests
        env:
          IS_TAURI: 'true'
        run: |
          bun run build:tauri:renderer
          bun run build:sidecar

      # Lets beforeBuildCommand skip the identical second renderer + Sidecar run.
      - name: Mark Tauri resources as prepared
        shell: bash
        run: echo "YPM_TAURI_RESOURCES_PREPARED=1" >> "$GITHUB_ENV"

      - name: Test Tauri backend
        if: needs.changes.outputs.rust == 'true'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Clippy Tauri backend
        if: needs.changes.outputs.rust == 'true'
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Verify release version
        run: bun run verify:tauri:version -- "${{ github.ref_type == 'tag' && github.ref_name || '' }}"

      - name: Verify updater signing configuration
        if: github.ref_type == 'tag'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: bun run verify:tauri:updater-env

      - name: Build locally signed Tauri app
        if: github.ref_type != 'tag'
        run: bun run build:tauri

      - name: Build locally signed Tauri app with updater artifacts
        if: github.ref_type == 'tag' && vars.APPLE_SIGNING_ENABLED != 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: bun run build:tauri:macos:updater

      - name: Package local DMG
        if: github.ref_type != 'tag' || vars.APPLE_SIGNING_ENABLED != 'true'
        run: bun run package:tauri:dmg

      - name: Verify Apple release secrets
        if: github.ref_type == 'tag' && vars.APPLE_SIGNING_ENABLED == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: bun run verify:tauri:release-env

      - name: Import Developer ID certificate
        if: github.ref_type == 'tag' && vars.APPLE_SIGNING_ENABLED == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/yesplaymusic-certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/yesplaymusic-build.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Build Developer ID signed and notarized DMG
        if: github.ref_type == 'tag' && vars.APPLE_SIGNING_ENABLED == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: bun run build:tauri:release

      # Tauri notarizes and staples the .app, then wraps it in a DMG it only
      # signs. But quarantine lands on the DMG — that is the file the browser
      # writes — and macOS evaluates the disk image itself on first open, so
      # an unstapled DMG still shows "Apple cannot check it for malicious
      # software" no matter how thoroughly the app inside is notarized.
      - name: Notarize and staple the DMG
        if: github.ref_type == 'tag' && vars.APPLE_SIGNING_ENABLED == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG="$(ls src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG"

      - name: Validate Developer ID signature and notarization ticket
        if: github.ref_type == 'tag' && vars.APPLE_SIGNING_ENABLED == 'true'
        run: |
          APP_PATH="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/YesPlayMusic.app"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          xcrun stapler validate src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

      - name: Collect notarized release DMG
        if: github.ref_type == 'tag' && vars.APPLE_SIGNING_ENABLED == 'true'
        run: bun run collect:tauri:release-dmg

      - name: Smoke packaged macOS runtime
        run: bun run smoke:tauri:core

      - name: Collect updater artifacts
        if: github.ref_type == 'tag'
        env:
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: bun scripts/collect-updater-artifacts.mjs darwin-aarch64 dist_tauri

      - name: Verify updater archive app signature
        if: github.ref_type == 'tag'
        run: bun scripts/verify-macos-updater.mjs

      - name: Verify complete macOS distribution set and checksums
        working-directory: dist_tauri
        run: |
          VERSION="$(node -p 'require("../package.json").version')"
          REQUIRED_ARTIFACTS=(
            "YesPlayMusic_${VERSION}_aarch64.dmg"
            "YesPlayMusic_${VERSION}_aarch64.dmg.sha256"
            "YesPlayMusic_${VERSION}_sidecar-source.tar.gz"
            "YesPlayMusic_${VERSION}_sidecar-source.tar.gz.sha256"
            "YesPlayMusic_${VERSION}_SOURCE-OFFER.md"
            "YesPlayMusic_${VERSION}_SOURCE-OFFER.md.sha256"
          )
          for artifact in "${REQUIRED_ARTIFACTS[@]}"; do
            test -s "$artifact" || { echo "Missing required release artifact: $artifact" >&2; exit 1; }
          done
          shasum -a 256 -c ./*.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: YesPlayMusic-macos-aarch64
          path: dist_tauri/*
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary signing keychain
        if: always() && github.ref_type == 'tag' && vars.APPLE_SIGNING_ENABLED == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/yesplaymusic-build.keychain-db" || true
          rm -f "$RUNNER_TEMP/yesplaymusic-certificate.p12"

  build-tauri-windows-x64:
    name: Tauri Windows x64
    needs: changes
    if: needs.changes.outputs.docs-only != 'true' && needs.changes.outputs.tui-only != 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy,rustfmt
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Prepare environment
        shell: pwsh
        run: Copy-Item .env.example .env

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Test
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: Test Rust Sidecar
        if: needs.changes.outputs.rust == 'true'
        run: cargo test --locked --manifest-path src-tauri/sidecar/Cargo.toml

      - name: Clippy Rust Sidecar
        if: needs.changes.outputs.rust == 'true'
        run: cargo clippy --locked --manifest-path src-tauri/sidecar/Cargo.toml --all-targets -- -D warnings

      - name: Check Rust formatting
        if: needs.changes.outputs.rust == 'true'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Prepare Tauri resources for Rust tests
        env:
          IS_TAURI: 'true'
        run: |
          bun run build:tauri:renderer
          bun run build:sidecar

      # Lets beforeBuildCommand skip the identical second renderer + Sidecar run.
      - name: Mark Tauri resources as prepared
        shell: bash
        run: echo "YPM_TAURI_RESOURCES_PREPARED=1" >> "$GITHUB_ENV"

      - name: Test Tauri backend
        if: needs.changes.outputs.rust == 'true'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Clippy Tauri backend
        if: needs.changes.outputs.rust == 'true'
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Verify release version
        run: bun run verify:tauri:version -- "${{ github.ref_type == 'tag' && github.ref_name || '' }}"

      - name: Verify updater signing configuration
        if: github.ref_type == 'tag'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: bun run verify:tauri:updater-env

      - name: Build unsigned Tauri NSIS installer
        if: github.ref_type != 'tag'
        run: bun run build:tauri:windows

      - name: Build Tauri NSIS installer with updater artifacts
        if: github.ref_type == 'tag'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: bun run build:tauri:windows:updater

      - name: Verify packaged Windows app compliance
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis" -Filter *.exe)
          if ($packages.Count -ne 1) { throw "Expected one NSIS installer, found $($packages.Count)" }
          Get-Command 7z -ErrorAction Stop | Out-Null
          bun scripts/verify-packaged-app-compliance.mjs windows-x86_64 $packages[0].FullName
          if ($LASTEXITCODE -ne 0) { throw "Windows app compliance verification failed" }

      - name: Verify Rust Sidecar and UNM
        shell: pwsh
        run: |
          $sidecarSmoke = Start-Process `
            -FilePath "src-tauri/binaries/yesplaymusic-sidecar-x86_64-pc-windows-msvc.exe" `
            -ArgumentList "--unm-smoke-test" `
            -Wait `
            -PassThru
          if ($sidecarSmoke.ExitCode -ne 0) { throw "Windows Sidecar smoke test failed with exit code $($sidecarSmoke.ExitCode)" }

      # Installing NSIS would mutate the runner; launch its assembled release layout instead.
      - name: Smoke packaged Windows runtime
        run: bun run smoke:tauri:core

      # PRs build for validation; distributable artifacts come only from repository refs.
      - name: Collect installer and create SHA-256 checksum
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist_tauri_windows | Out-Null
          Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis" -Filter *.exe |
            Copy-Item -Destination dist_tauri_windows
          $hashes = Get-ChildItem dist_tauri_windows -Filter *.exe | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$($_.Name)"
          }
          if (-not $hashes) {
            throw 'Tauri Windows build did not produce an NSIS installer'
          }
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD 'dist_tauri_windows/SHA256SUMS-windows-x64.txt'),
            (($hashes -join "`n") + "`n"),
            [System.Text.UTF8Encoding]::new($false)
          )
          @"
          YesPlayMusic Tauri Windows x64 experimental test build
          Commit: $env:GITHUB_SHA

          This package is unsigned. Windows SmartScreen may warn before installation.
          Do not disable antivirus or SmartScreen globally.
          "@ | Set-Content -Encoding utf8NoBOM dist_tauri_windows/TESTING-NOTICE-windows-x64.txt
          Get-Content dist_tauri_windows/SHA256SUMS-windows-x64.txt

      - name: Collect updater artifacts
        if: github.ref_type == 'tag'
        env:
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: bun scripts/collect-updater-artifacts.mjs windows-x86_64 dist_tauri_windows

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: YesPlayMusic-windows-x64-${{ github.sha }}
          path: dist_tauri_windows/*
          if-no-files-found: error
          retention-days: 7

  build-tauri-linux-x64:
    name: Tauri Ubuntu x64
    needs: changes
    if: needs.changes.outputs.docs-only != 'true' && needs.changes.outputs.tui-only != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            dbus \
            wget \
            file \
            libxdo-dev \
            libdbus-1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            squashfs-tools \
            xvfb

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy,rustfmt
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Prepare environment
        run: cp .env.example .env

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Test
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: Test Rust Sidecar
        if: needs.changes.outputs.rust == 'true'
        run: cargo test --locked --manifest-path src-tauri/sidecar/Cargo.toml

      - name: Clippy Rust Sidecar
        if: needs.changes.outputs.rust == 'true'
        run: cargo clippy --locked --manifest-path src-tauri/sidecar/Cargo.toml --all-targets -- -D warnings

      - name: Check Rust formatting
        if: needs.changes.outputs.rust == 'true'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Prepare Tauri resources for Rust tests
        env:
          IS_TAURI: 'true'
        run: |
          bun run build:tauri:renderer
          bun run build:sidecar

      # Lets beforeBuildCommand skip the identical second renderer + Sidecar run.
      - name: Mark Tauri resources as prepared
        shell: bash
        run: echo "YPM_TAURI_RESOURCES_PREPARED=1" >> "$GITHUB_ENV"

      - name: Test Tauri backend
        if: needs.changes.outputs.rust == 'true'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Clippy Tauri backend
        if: needs.changes.outputs.rust == 'true'
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Verify release version
        run: bun run verify:tauri:version -- "${{ github.ref_type == 'tag' && github.ref_name || '' }}"

      - name: Verify updater signing configuration
        if: github.ref_type == 'tag'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: bun run verify:tauri:updater-env

      - name: Build unsigned Tauri Linux packages
        if: github.ref_type != 'tag'
        run: bun run build:tauri:linux

      - name: Build Tauri Linux packages with updater artifacts
        if: github.ref_type == 'tag'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: bun run build:tauri:linux:updater

      - name: Verify packaged Linux app compliance
        run: |
          YPM_APPIMAGES=(src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage)
          YPM_DEBS=(src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb)
          test "${#YPM_APPIMAGES[@]}" -eq 1
          test "${#YPM_DEBS[@]}" -eq 1
          bun scripts/verify-packaged-app-compliance.mjs linux-x86_64-appimage "${YPM_APPIMAGES[0]}"
          bun scripts/verify-packaged-app-compliance.mjs linux-x86_64-deb "${YPM_DEBS[0]}"

      - name: Verify Rust Sidecar and UNM
        run: src-tauri/binaries/yesplaymusic-sidecar-x86_64-unknown-linux-gnu --unm-smoke-test

      - name: Smoke packaged Linux AppImage runtime
        run: |
          YPM_APPIMAGE_SMOKE_CACHE="$(mktemp -d)"
          XDG_CACHE_HOME="$YPM_APPIMAGE_SMOKE_CACHE" dbus-run-session -- xvfb-run -a bun run smoke:tauri:core

      - name: Smoke packaged Linux deb Sidecar
        run: |
          YPM_DEB_SMOKE_ROOT="$(mktemp -d)"
          YPM_DEB_PACKAGES=(src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb)
          test "${#YPM_DEB_PACKAGES[@]}" -eq 1
          dpkg-deb -x "${YPM_DEB_PACKAGES[0]}" "$YPM_DEB_SMOKE_ROOT"
          test ! -e "$YPM_DEB_SMOKE_ROOT/usr/lib/yesplaymusic/sidecar.payload"
          "$YPM_DEB_SMOKE_ROOT/usr/bin/yesplaymusic-sidecar" --unm-smoke-test

      - name: Collect packages and create SHA-256 checksums
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p dist_tauri_linux
          cp src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage dist_tauri_linux/
          cp src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb dist_tauri_linux/
          cd dist_tauri_linux
          sha256sum ./*.AppImage ./*.deb > SHA256SUMS-linux-x64.txt
          printf '%s\n' \
            'YesPlayMusic Tauri Ubuntu x64 experimental test build' \
            "Commit: $GITHUB_SHA" \
            '' \
            'AppImage can run without installation. The deb package targets Ubuntu/Debian systems.' \
            > TESTING-NOTICE-linux-x64.txt
          sha256sum -c SHA256SUMS-linux-x64.txt

      - name: Collect updater artifacts
        if: github.ref_type == 'tag'
        env:
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          bun scripts/collect-updater-artifacts.mjs linux-x86_64-appimage dist_tauri_linux
          bun scripts/collect-updater-artifacts.mjs linux-x86_64-deb dist_tauri_linux

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: YesPlayMusic-linux-x64-${{ github.sha }}
          path: dist_tauri_linux/*
          if-no-files-found: error
          retention-days: 7

  build-ypm:
    name: ypm ${{ matrix.label }}
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos-aarch64
            target: aarch64-apple-darwin
            source: ypm
            dest: ypm-macos-aarch64
          - os: ubuntu-22.04
            label: linux-x64
            target: x86_64-unknown-linux-gnu
            source: ypm
            dest: ypm-linux-x64
          - os: windows-latest
            label: windows-x64
            target: x86_64-pc-windows-msvc
            source: ypm.exe
            dest: ypm-windows-x64.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: clippy,rustfmt
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install audio build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils libasound2-dev pkg-config lld

      - name: Test ypm and core
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -p yesplaymusic-tui -p yesplaymusic-core --all-features

      - name: Clippy ypm
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml -p yesplaymusic-tui --all-targets -- -D warnings

      - name: Check ypm formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -p yesplaymusic-tui -- --check

      - name: Build ypm
        env:
          # GNU ld neither folds identical code nor matches MSVC/Mach-O
          # linker GC; lld + ICF keeps the Linux binary near the other
          # platforms instead of ~60% larger.
          RUSTFLAGS: ${{ runner.os == 'Linux' && '-C link-arg=-fuse-ld=lld -C link-arg=-Wl,--icf=all' || '' }}
          # Embedded at compile time: `ypm update` verifies release
          # signatures against it and refuses to update without one.
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: cargo build --locked --release --manifest-path src-tauri/Cargo.toml -p yesplaymusic-tui --target ${{ matrix.target }}

      - name: Smoke ypm runtime
        shell: bash
        run: '"src-tauri/target/${{ matrix.target }}/release/${{ matrix.source }}" --version'

      - name: Verify Linux GLIBC 2.35 baseline
        if: runner.os == 'Linux'
        shell: bash
        run: |
          YPM_BINARY="src-tauri/target/${{ matrix.target }}/release/${{ matrix.source }}"
          YPM_MAX_GLIBC="$({ readelf --version-info "$YPM_BINARY" || exit 1; } \
            | sed -n 's/.*Name: GLIBC_\([0-9][0-9.]*\).*/\1/p' \
            | sort -Vu \
            | tail -n 1)"
          test -n "$YPM_MAX_GLIBC"
          echo "Highest required GLIBC: $YPM_MAX_GLIBC"
          dpkg --compare-versions "$YPM_MAX_GLIBC" le 2.35

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist-ypm
          cp "src-tauri/target/${{ matrix.target }}/release/${{ matrix.source }}" "dist-ypm/${{ matrix.dest }}"

      # GPL complete-corresponding-source kit rides the Linux leg on tags;
      # provenance reads target/release/, so mirror the target-dir binary.
      - uses: oven-sh/setup-bun@v2
        if: github.ref_type == 'tag' && runner.os == 'Linux'
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        if: github.ref_type == 'tag' && runner.os == 'Linux'
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build ypm complete-source kit
        if: github.ref_type == 'tag' && runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p src-tauri/target/release
          cp "src-tauri/target/${{ matrix.target }}/release/${{ matrix.source }}" src-tauri/target/release/ypm
          bun run build:ypm:compliance
          VERSION="${GITHUB_REF_NAME#v}"
          tar -czf "dist-ypm/YesPlayMusic_${VERSION}_ypm-source.tar.gz" -C src-tauri/generated ypm-complete-source

      - uses: actions/upload-artifact@v7
        with:
          name: ypm-${{ matrix.target }}
          path: dist-ypm/
          if-no-files-found: error

  draft-release:
    name: Draft GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-tauri-arm64
      - build-tauri-windows-x64
      - build-tauri-linux-x64
      - build-ypm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - uses: actions/download-artifact@v8
        with:
          name: YesPlayMusic-macos-aarch64
          path: release/macos

      - uses: actions/download-artifact@v8
        with:
          name: YesPlayMusic-windows-x64-${{ github.sha }}
          path: release/windows

      - uses: actions/download-artifact@v8
        with:
          name: YesPlayMusic-linux-x64-${{ github.sha }}
          path: release/linux

      - uses: actions/download-artifact@v8
        with:
          pattern: ypm-*
          path: release/ypm
          merge-multiple: true

      - name: Sign ypm binaries for `ypm update`
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          bun install --frozen-lockfile --ignore-scripts
          for bin in release/ypm/ypm-macos-aarch64 release/ypm/ypm-linux-x64 release/ypm/ypm-windows-x64.exe; do
            test -s "$bin" || { echo "Missing ypm binary: $bin" >&2; exit 1; }
            bunx tauri signer sign -k "$TAURI_SIGNING_PRIVATE_KEY" -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$bin"
            test -s "$bin.sig" || { echo "Signing produced no signature for $bin" >&2; exit 1; }
          done

      - name: Install updater artifact inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full squashfs-tools

      - name: Generate updater manifest
        env:
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bun scripts/generate-updater-manifest.mjs release release/latest.json "$VERSION" "$GITHUB_REF_NAME"

      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          files: release/**/*
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
